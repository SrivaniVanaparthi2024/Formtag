<html lang="en">
<head>

<body>
    <form name="Registration Form" action="https://dummyweb.com" method="post">
        <table align="center">
           <caption >
            <pre><h1>Registrration Form</h1></pre>

               <tr>
                   <td><label for="id1">First Name</label><br>
                       <input type="text" name="firstname" id="id1" placeholder="your first name">

                    <label for="id2">Last Name</label><br>
                    <input type="text" name="lastname" id="id2" placeholder="your last name">

                </tr>
                <tr></tr>
               <tr>
                <td><label for="id2">Birthday</label><br>

                </td>
               </tr><tr></tr>
               <tr>
                <td colspan="2">
                    <label for="sub">Subject</label><br>
                    <select name="subject" id="sub">

                    </select>
                </td>
               </tr> <tr></tr><tr></tr>
               <tr>

        </table>
